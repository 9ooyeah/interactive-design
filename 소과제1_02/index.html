<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 모바일 필수: 폰에서 PC용 화면처럼 축소되는 것 방지 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no"
    />
    <title>Homework5</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        padding: 0;
        margin: 0;
        overflow: hidden;
        background-color: #080808;
      }
      /* 터치 필수: 브라우저가 스크롤/확대 대신 코드에 터치를 넘기도록 함.
         iOS Safari는 canvas가 아니라 body에 걸어야 인정함 */
      body {
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      canvas {
        display: block;
        touch-action: none;
      }
    </style>
    <!-- 먼저 p5.js 불러오기 -->
    <script src="../p5.min.js"></script>

    <!-- 그다음 Matter.js 불러오기 -->
    <script src="../addons/matter.js"></script>

    <!-- 마지막으로 내가 만든 코드 실행하기 -->
    <script src="sketch.js"></script>
  </head>
  <body>
    <script>
      // 터치 필수: Safari는 CSS만으로는 드래그 스크롤을 완전히 못 막아서 스크립트로 한 번 더 차단
      document.addEventListener(
        "touchmove",
        function (e) {
          e.preventDefault();
        },
        { passive: false }
      );
    </script>
  </body>
</html>
